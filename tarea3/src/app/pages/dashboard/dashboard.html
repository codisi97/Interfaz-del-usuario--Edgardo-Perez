<div class="min-h-screen bg-gray-50">
  <div class="flex flex-col lg:flex-row">

    <aside class="bg-white p-4 border-b lg:border-b-0 lg:border-r w-full lg:w-64">
      <h1 class="text-xl font-bold mb-4">
        Dashboard
      </h1>

      <nav class="flex flex-col gap-2">
        <a class="p-2 rounded hover:bg-gray-100">Inicio</a>
        <a class="p-2 rounded hover:bg-gray-100">Usuarios</a>
        <a class="p-2 rounded hover:bg-gray-100">Reportes</a>
        <a class="p-2 rounded hover:bg-gray-100">Configuración</a>
      </nav>
    </aside>

    <main class="flex-1 p-6">
      <h2 class="text-2xl font-semibold">
        Panel de Control
      </h2>

      <p class="text-gray-600 mb-6">
        Resumen general del sistema
      </p>

      <section class="mt-6">
        <div class="flex flex-col gap-4 lg:flex-row">
          <app-stat-card
            title="Conductores registrados"
            value="128">
          </app-stat-card>

          <app-stat-card
            title="Viajes realizados"
            value="3,540">
          </app-stat-card>

          <app-stat-card
            title="Ganancias totales"
            value="$ 12,480">
          </app-stat-card>
        </div>
      </section>

      <section class="mt-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          @for (driver of drivers; track driver.name) {
            <app-driver-card [driver]="driver"></app-driver-card>
          }
        </div>
      </section>
    </main>

  </div>
</div>
